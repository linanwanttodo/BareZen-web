name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'barezen-bom/**'
      - 'framework/**'
      - 'examples/**'
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'barezen-bom/**'
      - 'framework/**'
      - 'examples/**'
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: verify on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the compatibility baseline, JDK 21 the recommended runtime (ADR-0002).
        # A green build on both is the definition of "compatible", not a review question.
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Assert the compile baseline is still JDK 17
        run: ./scripts/check-jdk-baseline.sh

      - name: mvn clean verify
        # Each module activates its own 85% line-coverage gate under a [21,) JDK profile, so this single
        # command means "compatibility + quality" on 21 and "compatibility" on 17 (ADR-0002).
        run: mvn -B -ntp clean verify

      - name: Assert every emitted class file is major 61
        # The step above proves the build was configured for JDK 17; this one proves what it produced is JDK 17
        # bytecode. Both run on both JDKs, because the compiler that emitted 65 is the one whose output is checked.
        # Runs against the target/ the build just filled, so a wrong major fails the job rather than being reviewed
        # (ADR-0032).
        run: ./scripts/check-class-major.sh

      - name: Assert the documentation site is self-consistent
        # site/ left the reactor in 3.8, so nothing in `mvn verify` looks at it any more (ADR-0054). This is the step
        # that keeps its links, its language pairing and its all-relative addressing honest — the guarantees the deleted
        # barezen-site module's tests used to give.
        run: ./scripts/check-site.sh

      - name: Upload coverage report
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: framework/**/target/site/jacoco
          retention-days: 7

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-jdk${{ matrix.java }}
          path: framework/**/target/surefire-reports
          retention-days: 7
